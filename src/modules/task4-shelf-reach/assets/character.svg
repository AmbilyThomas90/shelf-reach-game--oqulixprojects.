<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" fill="none">
  <defs>
    <linearGradient id="furBody" x1="130" y1="120" x2="130" y2="325" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="65%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="furHead" x1="130" y1="22" x2="130" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="apronGreen" x1="80" y1="160" x2="180" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="shirtCream" x1="130" y1="148" x2="130" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="starGold" x1="130" y1="205" x2="130" y2="237" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Soft ground shadow on counter -->
  <ellipse cx="130" cy="326" rx="68" ry="10" fill="#2d1606" opacity="0.22"/>

  <!-- Left waving arm (behind apron) -->
  <path d="M74 176 C46 154 34 128 38 106 C42 90 62 88 70 104 C76 116 80 134 88 148"
        fill="url(#furBody)" stroke="#2d1606" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left paw pad -->
  <ellipse cx="52" cy="108" rx="9" ry="7" transform="rotate(-18 52 108)" fill="#fde68a"/>
  <circle cx="44" cy="99" r="2.8" fill="#fde68a"/>
  <circle cx="52" cy="96" r="2.8" fill="#fde68a"/>
  <circle cx="60" cy="99" r="2.8" fill="#fde68a"/>

  <!-- Right resting arm -->
  <path d="M186 174 C212 190 220 224 208 244 C200 256 182 252 178 238 C174 224 172 204 170 194"
        fill="url(#furBody)" stroke="#2d1606" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legs & sturdy shoes/feet -->
  <rect x="86" y="294" width="34" height="32" rx="14" fill="#78350f" stroke="#2d1606" stroke-width="5"/>
  <rect x="140" y="294" width="34" height="32" rx="14" fill="#78350f" stroke="#2d1606" stroke-width="5"/>
  <ellipse cx="101" cy="322" rx="22" ry="10" fill="#451a03" stroke="#2d1606" stroke-width="4.5"/>
  <ellipse cx="159" cy="322" rx="22" ry="10" fill="#451a03" stroke="#2d1606" stroke-width="4.5"/>

  <!-- Torso & cream shirt collar -->
  <ellipse cx="130" cy="224" rx="64" ry="82" fill="url(#furBody)" stroke="#2d1606" stroke-width="5.5"/>
  <path d="M84 166 C98 152 162 152 176 166 L170 206 L90 206 Z" fill="url(#shirtCream)" stroke="#2d1606" stroke-width="4.5"/>

  <!-- Grocer's green apron -->
  <path d="M90 166 L170 166 L182 292 C182 302 172 308 160 308 L100 308 C88 308 78 302 78 292 Z"
        fill="url(#apronGreen)" stroke="#2d1606" stroke-width="5" stroke-linejoin="round"/>
  <!-- Apron straps & waist ties -->
  <path d="M92 166 L94 148 M168 166 L166 148" stroke="#065f46" stroke-width="9" stroke-linecap="round"/>
  <path d="M92 166 L94 148 M168 166 L166 148" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 238 L178 238" stroke="#064e3b" stroke-width="4" opacity="0.45"/>

  <!-- Apron pocket with wooden spoon & pencil -->
  <path d="M98 252 L162 252 L159 286 C158 293 152 296 146 296 L114 296 C108 296 102 293 101 286 Z"
        fill="#047857" stroke="#064e3b" stroke-width="3.5"/>
  <!-- Golden Star Badge -->
  <polygon points="130,186 135,198 148,199 138,208 141,221 130,214 119,221 122,208 112,199 125,198"
           fill="url(#starGold)" stroke="#2d1606" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bow tie -->
  <polygon points="130,158 114,150 114,166" fill="#ef4444" stroke="#2d1606" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="130,158 146,150 146,166" fill="#ef4444" stroke="#2d1606" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="130" cy="158" r="5" fill="#dc2626" stroke="#2d1606" stroke-width="2.5"/>

  <!-- Bear Ears -->
  <circle cx="76" cy="52" r="22" fill="#92400e" stroke="#2d1606" stroke-width="5"/>
  <circle cx="76" cy="52" r="12" fill="#fda4af"/>
  <circle cx="184" cy="52" r="22" fill="#92400e" stroke="#2d1606" stroke-width="5"/>
  <circle cx="184" cy="52" r="12" fill="#fda4af"/>

  <!-- Grocer Cap (emerald green with white brim) -->
  <path d="M94 42 C96 20 164 20 166 42 Z" fill="#059669" stroke="#2d1606" stroke-width="4.5"/>
  <path d="M88 42 Q130 34 172 42 Q130 48 88 42 Z" fill="#ecfdf5" stroke="#2d1606" stroke-width="3.5"/>

  <!-- Head -->
  <ellipse cx="130" cy="96" rx="58" ry="52" fill="url(#furHead)" stroke="#2d1606" stroke-width="5.5"/>

  <!-- Eyebrows -->
  <path d="M94 74 Q104 68 113 73" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>
  <path d="M147 73 Q156 68 166 74" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes with sparkle -->
  <circle cx="105" cy="88" r="7.5" fill="#1e293b"/>
  <circle cx="102.5" cy="85.5" r="2.8" fill="#ffffff"/>
  <circle cx="107.5" cy="90.5" r="1.2" fill="#ffffff"/>

  <circle cx="155" cy="88" r="7.5" fill="#1e293b"/>
  <circle cx="152.5" cy="85.5" r="2.8" fill="#ffffff"/>
  <circle cx="157.5" cy="90.5" r="1.2" fill="#ffffff"/>

  <!-- Rosy cheeks -->
  <ellipse cx="86" cy="104" rx="10" ry="6" fill="#fb7185" opacity="0.48"/>
  <ellipse cx="174" cy="104" rx="10" ry="6" fill="#fb7185" opacity="0.48"/>

  <!-- Muzzle -->
  <ellipse cx="130" cy="112" rx="28" ry="22" fill="#fef3c7" stroke="#2d1606" stroke-width="3.5"/>
  <!-- Nose -->
  <ellipse cx="130" cy="102" rx="10" ry="7" fill="#2d1606"/>
  <ellipse cx="127" cy="100" rx="3.5" ry="1.8" fill="#ffffff" opacity="0.55"/>
  <!-- Warm cheerful smile -->
  <path d="M130 109 L130 116" stroke="#2d1606" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M116 116 Q130 128 144 116" stroke="#2d1606" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M122 119 Q130 129 138 119 Q130 121 122 119 Z" fill="#f43f5e"/>
</svg>
