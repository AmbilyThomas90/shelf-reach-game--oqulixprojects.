<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="rightGlove" x1="20" y1="12" x2="76" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="rightShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#451a03" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#rightShadow)">
    <!-- Open right hand silhouette (thumb on left, mirrored) -->
    <path d="M69 46 L69 25 C69 20 61 20 61 25 L61 42
             L59 16 C59 11 50 11 50 16 L50 40
             L47 14 C47 9 38 9 38 14 L38 41
             L35 20 C35 15 27 16 27 21 L29 52
             L21 43 C17 39 11 44 15 50 L28 70
             C32 76 38 80 48 80 L55 80 C65 80 71 73 71 63 L71 46 Z"
          fill="url(#rightGlove)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <!-- Inner palm highlight -->
    <ellipse cx="48" cy="59" rx="12" ry="11" fill="#fef08a" opacity="0.42"/>
    <!-- R badge -->
    <circle cx="48" cy="60" r="10.5" fill="#451a03" stroke="#ffffff" stroke-width="2"/>
    <text x="48" y="64.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff">R</text>
  </g>
</svg>
