             L37 16 C37 11 46 11 46 16 L46 40
             L49 14 C49 9 58 9 58 14 L58 41
             L61 20 C61 15 69 16 69 21 L67 52
             L75 43 C79 39 85 44 81 50 L68 70
             C64 76 58 80 48 80 L41 80 C31 80 25 73 25 63 L25 46 Z"
