    <!-- Inner palm highlight -->
    <ellipse cx="48" cy="59" rx="12" ry="11" fill="#a5f3fc" opacity="0.42"/>
    <!-- L badge -->
    <circle cx="48" cy="60" r="10.5" fill="#083344" stroke="#ffffff" stroke-width="2"/>
    <text x="48" y="64.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff">L</text>
