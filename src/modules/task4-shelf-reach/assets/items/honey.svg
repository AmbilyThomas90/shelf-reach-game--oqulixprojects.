<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none">
  <defs>
    <linearGradient id="honeyBody" x1="36" y1="84" x2="184" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="32%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="honeyPool" x1="110" y1="90" x2="110" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="56" y1="22" x2="164" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="66" y1="64" x2="154" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="labelCream" x1="60" y1="122" x2="160" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Jar glass neck -->
  <rect x="64" y="62" width="92" height="24" rx="8" fill="url(#neckGrad)" stroke="#2d1606" stroke-width="5"/>

  <!-- Main chubby honey jar body -->
  <path d="M56 84 C40 90 32 112 32 146 L32 204 C32 230 50 246 80 246 L140 246 C170 246 188 230 188 204 L188 146 C188 112 180 90 164 84 Z"
        fill="url(#honeyBody)" stroke="#2d1606" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Inner depth & honey drip shading -->
  <path d="M40 144 C40 116 46 98 62 92 L158 92 C174 98 180 116 180 144 L180 202 C180 224 164 238 138 238 L82 238 C56 238 40 224 40 202 Z"
        fill="url(#honeyPool)"/>

  <!-- Top golden honey rim -->
  <ellipse cx="110" cy="96" rx="52" ry="8" fill="#fde047" opacity="0.65"/>

  <!-- Specular glass shine on left -->
  <path d="M48 116 C44 134 44 186 50 208" stroke="#fffbeb" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <circle cx="52" cy="102" r="4.5" fill="#ffffff" opacity="0.85"/>
  <path d="M170 124 C174 146 174 184 170 202" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- Scalloped cream honey label -->
  <rect x="56" y="118" width="108" height="94" rx="18" fill="url(#labelCream)" stroke="#2d1606" stroke-width="4"/>
  <rect x="63" y="125" width="94" height="80" rx="13" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Cute honeybee emblem -->
  <g transform="translate(110 152)">
    <!-- Wings -->
    <ellipse cx="-10" cy="-10" rx="10" ry="6" transform="rotate(-24 -10 -10)" fill="#e0f2fe" stroke="#2d1606" stroke-width="2.5"/>
    <ellipse cx="10" cy="-10" rx="10" ry="6" transform="rotate(24 10 -10)" fill="#e0f2fe" stroke="#2d1606" stroke-width="2.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#fbbf24" stroke="#2d1606" stroke-width="3"/>
    <path d="M-4 -9.5 L-4 9.5 M3 -9.5 L3 9.5" stroke="#2d1606" stroke-width="3.2"/>
    <circle cx="-10" cy="-1" r="2" fill="#2d1606"/>
    <path d="M-13 -8 Q-17 -14 -20 -13" stroke="#2d1606" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Label banner text -->
  <text x="110" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#78350f" letter-spacing="0.5">HONEY</text>
  <text x="110" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#b45309" letter-spacing="1">PURE GOLD</text>

  <!-- Crimson lid with gingham stripe & wooden dipper knob feel -->
  <rect x="52" y="24" width="116" height="44" rx="14" fill="url(#lidGrad)" stroke="#2d1606" stroke-width="5"/>
  <!-- Gingham cream bands -->
  <path d="M68 27 L68 65 M96 27 L96 65 M124 27 L124 65 M152 27 L152 65" stroke="#fecaca" stroke-width="6" opacity="0.45"/>
  <path d="M55 44 L165 44" stroke="#fecaca" stroke-width="6" opacity="0.4"/>
  <!-- Lid top highlight -->
  <path d="M66 32 L144 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Lid bottom rim -->
  <rect x="48" y="54" width="124" height="16" rx="7" fill="#b91c1c" stroke="#2d1606" stroke-width="4.5"/>
  <path d="M62 60 L158 60" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
</svg>
